<style>
@font-face{font-family:"Space Grotesk";font-weight:400;font-display:swap;src:url("../fonts/space-grotesk-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:500;font-display:swap;src:url("../fonts/space-grotesk-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:700;font-display:swap;src:url("../fonts/space-grotesk-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url("../fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url("../fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
:root{
  --bg:#0F1B2D; --text:#F4F1EA; --muted:#A9B4C4; --body:#C9D2DE;
  --card:#17283F; --line:#2A3C57; --accent:#F2A33A;
  --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--text);text-decoration:none}
a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
h1,h2,h3,p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding:0 32px}
@media (max-width:560px){.wrap{padding:0 20px}}
.label{font-family:var(--mono);font-size:15px;letter-spacing:3px;color:var(--muted)}
.label.accent{color:var(--accent)}
.hero{padding:48px 0 32px;display:flex;flex-direction:column;gap:24px}
.hero h1{font-weight:700;font-size:clamp(36px,5.6vw,68px);line-height:1.05;letter-spacing:-0.02em}
.hero h1 span{color:var(--accent)}
.lead{font-size:clamp(18px,1.7vw,22px);line-height:1.5;color:var(--body);max-width:680px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:560px){.tally{grid-template-columns:repeat(2,1fr)}}
.tally div{background:var(--card);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.tally b{font-size:32px;font-weight:700}
.tally span{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--muted)}
section.blk{padding:40px 0 0}
section.blk h2{font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-0.01em;padding-bottom:12px}
section.blk p,section.blk li{font-size:18px;line-height:1.6;color:var(--body);max-width:680px}
section.blk ul{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:200px 1fr 64px;gap:8px 20px;align-items:center;padding:16px 0;border-top:2px solid var(--line)}
.row:last-child{border-bottom:2px solid var(--line)}
@media (max-width:560px){.row{grid-template-columns:1fr 64px}.row .bar{grid-column:1/-1}}
.row h3{font-size:19px;font-weight:700}
.row small{display:block;font-size:15px;font-weight:400;color:var(--muted);line-height:1.4;margin-top:2px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row .n{font-family:var(--mono);font-size:16px;text-align:right;color:var(--body)}
.ex{background:var(--card);border-radius:18px;padding:22px 24px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.ex .label{font-size:13px}
.ex .q{font-size:18px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.ex .a{font-size:17px;line-height:1.55;color:var(--body);overflow-wrap:anywhere}
.ex .tagline{font-family:var(--mono);font-size:13px;letter-spacing:1px;color:var(--muted)}
.btn{display:inline-block;margin-top:16px;font-weight:500;font-size:17px;color:var(--accent);padding:8px 0}
.btn:hover{text-decoration:underline}
.fine{font-family:var(--mono);font-size:13px;letter-spacing:1px;color:var(--muted);line-height:1.6;padding:32px 0 8px}
</style>
